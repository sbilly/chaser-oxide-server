services:
  chaser-oxide:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - NO_PROXY=${NO_PROXY:-}
    image: sbilly/chaser-oxide-server:latest
    container_name: chaser-oxide-server
    ports:
      - "50051:50051"
    environment:
      - RUST_LOG=info
      - CHASER_HOST=0.0.0.0
      - CHASER_PORT=50051
      - CHASER_HEADLESS=true
      - CHASER_BROWSER_PATH=/usr/bin/chromium
      - CHASER_ENABLE_STEALTH=true
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "chaser-oxide-server"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: chaser-network
